# docker-compose.yml — entorno local de Notiva listo para `docker compose up -d`
#
# Servicios:
#   - postgres:    Postgres 17 + pgvector preinstalado (pgvector/pgvector:pg17)
#   - backend:     FastAPI + uvicorn, hot-reload activo en dev
#   - frontend:    nginx sirviendo el build de Angular
#   - gotenberg:   conversor DOCX→PDF (opcional, Sprint 0..)
#
# Uso:
#   cp .env.example .env       # ajusta GROQ_API_KEY, OPENAI_API_KEY, etc.
#   docker compose up -d --build
#   docker compose logs -f backend
#   open http://localhost:8000     (backend)
#   open http://localhost:4200     (frontend)
#
# Datos persistidos en volumen `notiva_pgdata`. Para reset: `docker compose down -v`.

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: notiva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: notiva
      POSTGRES_USER: notiva
      POSTGRES_PASSWORD: notiva_local_dev
    ports:
      - "5433:5432"        # 5433 host para no chocar con un Postgres local del usuario
    volumes:
      - notiva_pgdata:/var/lib/postgresql/data
      - ./local/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notiva -d notiva"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notiva-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://notiva:notiva_local_dev@postgres:5432/notiva
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-x-local-dev-secret-must-be-at-least-32-chars-long-x}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BCRYPT_ROUNDS: "4"      # rápido en dev; producción usa 12
      PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:4200
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "8000:8000"
    volumes:
      # Bind mount opcional para iterar sin rebuild. Si te molesta, comenta
      # esta línea y haz `docker compose up -d --build` cuando cambies código.
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NG_APP_API_URL: http://localhost:8000
    container_name: notiva-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: notiva-gotenberg
    restart: unless-stopped
    ports:
      - "3002:3000"          # 3002 host (3001 suele estar ocupado en macs con dev tooling)

volumes:
  notiva_pgdata:
