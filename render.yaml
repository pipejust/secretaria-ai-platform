# Render Blueprint para Notiva
# https://render.com/docs/blueprint-spec
#
# Decisión arquitectónica vigente:
#   - La base de datos vive en Supabase (no migramos a Render Postgres).
#   - El backend FastAPI corre como contenedor Docker en Render.
#   - Plan Starter ($7/mes) → no se duerme, sin cold-starts.
#
# Total: $7/mes de Render + lo que ya pagas a Supabase.

services:
  - type: web
    name: notiva-backend
    runtime: docker
    plan: starter            # 0.5 CPU, 512 MB RAM, sin spin-down
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Conexión a la BD: Supabase (Direct connection con add-on IPv4) ---
      - key: DATABASE_URL
        sync: false           # postgresql://postgres:PASS@db.<ref>.supabase.co:5432/postgres

      # Opcional, solo si algún día se usa supabase-py para storage o auth.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      # --- Auth ---
      - key: JWT_SECRET_KEY
        generateValue: true   # Render genera 256 bits aleatorios al primer deploy
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: BCRYPT_ROUNDS
        value: "12"

      # --- Runtime ---
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL
        # Después del primer deploy, copia aquí la URL pública del web service
        # (ej: https://notiva-backend.onrender.com).
        sync: false

      # --- LLM (ya están configuradas en Render hoy) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # --- Fireflies (la API Key general; el webhook_token se gestiona desde /admin/settings) ---
      - key: FIREFLIES_API_KEY
        sync: false

      # --- Frontend ---
      - key: FRONTEND_URL
        sync: false           # ej: https://notiva.vercel.app
