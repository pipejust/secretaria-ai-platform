# Acten — nginx config para servir el SPA Angular.
# Optimizado para SEO + performance + seguridad.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────────────────
    # MIME types — usamos los defaults de nginx (text/html, css, js, png, etc.).
    #
    # IMPORTANTE: NUNCA declarar un bloque `types { ... }` LOCAL en este
    # archivo. Hacerlo REEMPLAZA todo el mime.types global y nginx empieza
    # a servir .html como `application/octet-stream` → el browser ofrece
    # descargar la página en vez de renderizarla. Bug brutal.
    #
    # El override puntual de .webmanifest se hace con `add_header Content-Type`
    # en su `location = /site.webmanifest` específico (ver más abajo).
    # ─────────────────────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compresión gzip — ahorra ancho de banda y mejora LCP.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        application/ld+json
        image/svg+xml
        font/ttf
        font/otf;

    # ─────────────────────────────────────────────────────────────────────────
    # SEO: archivos públicos críticos — disponibles SIEMPRE en raíz, sin auth,
    # sin rewrite a SPA. Crawlers los piden ANTES de tocar la app.
    # ─────────────────────────────────────────────────────────────────────────
    location = /robots.txt {
        access_log off;
        log_not_found off;
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        access_log off;
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "application/manifest+json" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        access_log off;
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # index.html: NUNCA cachear. Es el único punto de entrada y referencia
    # los nombres hasheados de los chunks JS/CSS. Si el browser sirve un
    # index.html viejo, seguirá pidiendo chunks viejos eternamente.
    # ─────────────────────────────────────────────────────────────────────────
    location = /index.html {
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }

    # SPA: cualquier ruta no-archivo cae a index.html (también sin cache).
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }

    # Cache agresiva sólo para los chunks hasheados de Angular.
    # El nombre incluye un hash de contenido — al cambiar el código
    # cambia el nombre, así que `immutable` es seguro y los chunks
    # nuevos se sirven automáticamente cuando el index.html cambia.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$ {
        expires 1y;
        include /etc/nginx/acten-security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Headers de seguridad globales (aplican a TODAS las responses).
    # ─────────────────────────────────────────────────────────────────────────
    include /etc/nginx/acten-security-headers.conf;

    # Bloquear acceso a archivos sensibles si por error quedan en el bundle.
    location ~ /\.(env|git|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
