server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────────────────
    # index.html: NUNCA cachear. Es el único punto de entrada y referencia
    # los nombres hasheados de los chunks JS/CSS. Si el browser sirve un
    # index.html viejo, seguirá pidiendo chunks viejos eternamente.
    # ─────────────────────────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }

    # SPA: cualquier ruta no-archivo cae a index.html (también sin cache).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }

    # Cache agresiva sólo para los chunks hasheados de Angular.
    # El nombre incluye un hash de contenido — al cambiar el código
    # cambia el nombre, así que `immutable` es seguro y los chunks
    # nuevos se sirven automáticamente cuando el index.html cambia.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Headers básicos de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
