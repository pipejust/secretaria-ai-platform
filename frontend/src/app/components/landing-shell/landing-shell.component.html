<!--
  Shell de páginas dedicadas de la landing. Contiene:
   - header (mismo look que la home)
   - <ng-content> donde se proyecta el contenido de cada página
   - footer (compacto, links y copyright)

  Mientras carga el contenido del CMS se muestra un skeleton mínimo.
-->
<div class="al-shell" *ngIf="content as c; else loadingTpl">
  <header class="al-shell-header" [class.is-scrolled]="scrolled" role="banner">
    <div class="al-container al-shell-header__inner">
      <a routerLink="/" class="al-shell-brand" aria-label="Acten — Inicio">
        <img src="brand/acten-logo-full.svg" alt="Acten"
             class="al-shell-logo" width="118" height="32" />
      </a>

      <nav class="al-shell-nav" [class.is-open]="mobileMenuOpen" aria-label="Navegación principal">
        <ul class="al-shell-nav__list">
          <li *ngFor="let item of c.nav.items">
            <a [href]="item.anchor" (click)="navigateNav(item, $event)">{{ item.label }}</a>
          </li>
        </ul>
        <div class="al-shell-nav__actions">
          <a class="al-shell-btn al-shell-btn--ghost" [href]="loginUrl" (click)="closeMobileMenu()">
            {{ c.nav.login_label }}
          </a>
        </div>
      </nav>

      <div class="al-shell-actions">
        <a class="al-shell-btn al-shell-btn--ghost" [href]="loginUrl">{{ c.nav.login_label }}</a>
        <a class="al-shell-btn al-shell-btn--primary" routerLink="/demo">{{ c.nav.cta_label }}</a>
        <button type="button" class="al-shell-burger"
                (click)="toggleMobileMenu()"
                [attr.aria-expanded]="mobileMenuOpen"
                aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="al-shell-main">
    <ng-content></ng-content>
  </main>

  <footer class="al-shell-footer" role="contentinfo">
    <div class="al-container">
      <div class="al-shell-footer__grid">
        <div class="al-shell-footer__brand">
          <img src="brand/acten-logo-full.svg" alt="Acten" class="al-shell-footer__logo" />
          <p class="al-shell-footer__tagline">{{ c.footer.tagline }}</p>
        </div>
        <nav class="al-shell-footer__cols" aria-label="Pie de página">
          <div class="al-shell-footer__col" *ngFor="let col of c.footer.columns">
            <h3>{{ col.title }}</h3>
            <ul>
              <li *ngFor="let l of col.links">
                <a [href]="l.url" (click)="navigateNav({anchor: l.url}, $event)">{{ l.label }}</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
      <div class="al-shell-footer__bottom">
        <p class="al-shell-footer__copy">{{ copyrightLine(c.footer.copyright) }}</p>
        <ul class="al-shell-footer__legal" *ngIf="c.footer.legal_links?.length">
          <li *ngFor="let l of c.footer.legal_links">
            <a [href]="l.url" (click)="navigateNav({anchor: l.url}, $event)">{{ l.label }}</a>
          </li>
        </ul>
      </div>
    </div>
  </footer>
</div>

<ng-template #loadingTpl>
  <div class="al-shell-skeleton" aria-busy="true">
    <div class="al-shell-skeleton__bar"></div>
    <div class="al-shell-skeleton__bar al-shell-skeleton__bar--sm"></div>
    <div class="al-shell-skeleton__bar"></div>
  </div>
</ng-template>
