<div class="toast-stack" role="region" aria-label="Notificaciones" aria-live="polite">
    <article
        *ngFor="let toast of toasts; trackBy: trackById"
        class="toast toast--{{ toast.kind }}"
        role="status"
    >
        <span class="toast__icon" aria-hidden="true">
            <ng-container [ngSwitch]="toast.kind">
                <svg *ngSwitchCase="'success'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <svg *ngSwitchCase="'error'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <svg *ngSwitchCase="'warning'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <svg *ngSwitchDefault width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </ng-container>
        </span>
        <p class="toast__message">{{ toast.message }}</p>
        <button
            type="button"
            class="toast__close"
            [attr.aria-label]="'common.close_notification' | translate"
            (click)="dismiss(toast.id)"
        >
            ×
        </button>
    </article>
</div>
