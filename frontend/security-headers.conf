# Se incluye en server y en cada location que declara add_header.
# El micrófono solo se permite al propio origen para grabar reuniones.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
# El proxy de producción termina TLS; usar HTTPS en los dominios públicos.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
